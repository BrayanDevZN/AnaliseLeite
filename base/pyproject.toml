[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analiseleite"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "pyarrow",
    "scikit-learn",
    "joblib",
    "watchguardian",
]

[project.scripts]
model = "base.src.pipeline.ml.train.model:main"

[tool.setuptools]
package-dir = { "base" = "." }
packages = [
    "base",
    "base.src",
    "base.src.pipeline",
    "base.src.pipeline.etl",
    "base.src.pipeline.ml",
    "base.src.pipeline.ml.train"
]
