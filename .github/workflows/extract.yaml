name: extract

on:
    push:
        branches:
            - main
            - develop
        
    pull_request:
        branches:
            - main
            - develop


jobs:

    
    extract:
        runs-on: ubuntu-latest

        steps:

            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                python-version: "3.12"

            - run: pip install pandas
            - run: pip install pyarrow
            - run: python -m tests.unit.extract

        
        