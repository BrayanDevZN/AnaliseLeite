name: backend


on:
    push:
        branches:
            - main
            - develop
            - develop-v2
            - develop-model
            - develop-system

    pull_request:
        branches:
            - main
            - develop
            - develop-v2
            - develop-model
            - develop-system

jobs:

    build:

        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: base

        steps:

            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with:
                  go-version-file: base/go.mod
                  cache-dependency-path: base/go.sum

            - name: check format
              run: test -z "$(gofmt -l .)"

            - name: analyze code
              run: go vet ./...

            - name: execute unit config and logs
              run: go test -race -count=1 -coverpkg=./src/backend/... -skip 'TestHash|TestVerify|TestNewHasher|TestJWT' ./tests/unit/

            - name: execute unit hash
              run: go test -race -count=1 -coverpkg=./src/backend/... -run 'TestHash|TestVerify|TestNewHasher' ./tests/unit/

            - name: execute unit jwt
              run: go test -race -count=1 -coverpkg=./src/backend/... -run 'TestJWT' ./tests/unit/
