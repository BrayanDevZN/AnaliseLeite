name: transform

on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:

            - main
            - develop

jobs:

    transform:

        runs-on: ubuntu-latest

        steps:

            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                python-version: "3.14"

            - run: pip install pandas
            - run: python -m tests.integration.transform
