name: build

on:
    push:
        branches:
            - main
            - develop
            - develop-v2
    pull_request:
        branches:

            - main
            - develop
            - develop-v2

jobs:

    build:

        runs-on: ubuntu-latest
        environment: develop_pl

        env:
          ML_KEY: ${{secrets.ML_KEY}}

       

        steps:

            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5


            - name: run docker
              run: |
               docker compose -f base/compose.yml up --build -d
               sleep 10

            - name: install dependences
              run: pip install -r base/requirements.txt

            - name: execute unit
              run: |
                python -m base.tests.unit.raw

            - name: execute integration 
              run: |
               python -m base.tests.integration.silver
               python -m base.tests.integration.train
               python -m base.tests.integration.gold

            - name: execute functional
              run : |
                 pip install requests
                 python -m base.tests.functional.model
                 python -m base.tests.functional.api

            




    